[package]
name = "futari-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { optional=true, version = "0.12", default-features = false, features = ["native-tls","json"] }
tempfile = "3"
uuid = { version = "1", features = ["v4","serde"] }
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security","Win32_Security_Credentials","Win32_Graphics_Gdi","Win32_System_LibraryLoader","Win32_System_SystemInformation","Win32_System_RemoteDesktop","Win32_UI_WindowsAndMessaging","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Accessibility","Win32_UI_HiDpi","Win32_UI_Shell","Win32_Storage_FileSystem","Win32_System_WindowsProgramming"]}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cloud-sync = ["dep:reqwest"]

[profile.release]
strip = true
opt-level = "s"
