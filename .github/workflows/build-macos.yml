name: FUTARI Desktop macOS
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-verified-mac:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach the checked universal build to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45622293180 -R "$GITHUB_REPOSITORY" -n FUTARI-Desktop-macOS
          file=FUTARI-Desktop-macOS.zip
          digest=463083a68b6ae06fd20adeeccc3dd6f7dde3bb939e9d1dadc4c02c1b6231ff4a
          echo "$digest  $file" | sha256sum -c
          if ! gh release view ui-2026.11.25.1 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
            gh release upload ui-2026.11.25.1 "$file" -R "$GITHUB_REPOSITORY"
          fi
          gh release view ui-2026.11.25.1 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|select(.name=="FUTARI-Desktop-macOS.zip")|.digest' | grep -Fx "sha256:$digest"
  signed-ui:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the distributed Mac app and signed resource release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download v0.2.8 -R "$GITHUB_REPOSITORY" -p FUTARI-Desktop-macOS.zip
          gh release download ui-2026.11.25.1 -R "$GITHUB_REPOSITORY" -p manifest.json -p 'ui-*.zip'
          ditto -x -k FUTARI-Desktop-macOS.zip app
          codesign --verify --strict 'app/FUTARI Desktop.app'
      - name: Verify release signature, size, hashes and exact art
        run: |
          cd "$RUNNER_TEMP"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {verify,createPublicKey,createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const {ui} = JSON.parse(readFileSync('manifest.json'));
          const data = readFileSync('ui-2026.11.25.1.zip');
          const key = readFileSync(process.env.GITHUB_WORKSPACE+'/desktop/src-tauri/update-public-key.bin');
          const publicKey = createPublicKey({format:'der',type:'spki',key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'), key])});
          assert.equal(ui.version,'2026.11.25.1');
          assert.equal(ui.minAppVersion,'0.2.8');
          assert.equal(data.length,ui.size);
          assert.equal(createHash('sha256').update(data).digest('hex'),ui.sha256);
          assert(verify(null,data,publicKey,Buffer.from(ui.signature,'base64')));
          JS
          unzip -oq ui-2026.11.25.1.zip -d payload
          for atlas in caramel actions; do
            cmp "payload/art/$atlas.webp" "$GITHUB_WORKSPACE/src/modules/rabbit/art/$atlas.webp"
          done
      - name: Boot the archived old app with the selected release in its test profile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/app/FUTARI Desktop.app/Contents/MacOS/futari-desktop"
          "$bin" --verify-profile > first-launch.log 2>&1 &
          pid=$!
          root="$HOME/Library/Application Support/app.futari.desktop/acceptance/ui-cache/0.2.8"
          for i in {1..30}; do test -d "$root/releases" && break; sleep 1; done
          test -d "$root/releases"
          kill "$pid"
          wait "$pid" || true
          ver=2026.11.25.1
          mv payload "$root/releases/$ver"
          echo '{"active":null,"pending":"2026.11.25.1","failed":[]}' > "$root/state.json"
          swiftc "$GITHUB_WORKSPACE/.github/test-mac-update.swift" -o click-update
          sudo fs_usage -w -f filesys -t 45 futari-desktop > "$RUNNER_TEMP/file-access.log" 2>&1 &
          tracer=$!
          sleep 2
          "$bin" --verify-profile > updated-launch.log 2>&1 &
          pid=$!
          sleep 3
          ./click-update "$pid"
          for i in {1..28}; do
            grep -Fq "/$ver/art/actions.webp" file-access.log && break
            sleep 1
          done
          sleep 4
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
          wait "$tracer" || true
          cat "$root/state.json"
          jq -e '.active=="2026.11.25.1" and .failed==[]' "$root/state.json"
          for asset in stage.js art/caramel.webp art/actions.webp; do
            grep -F "/$ver/$asset" file-access.log | head -n 2 || true
            grep -Fq "/$ver/$asset" file-access.log
          done
      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          tail -c 6000 updated-launch.log || true
          grep -Ei 'ui-cache|not permitted|error' file-access.log | tail -n 25 || true
          find "$HOME/Library/Application Support" -path '*/acceptance/ui-cache*' -maxdepth 6 | head -n 12 || true
